<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Form Data Mahasiswa</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
      }

      .container {
        max-width: 1100px;
        margin: auto;
      }

      h2 {
        margin-bottom: 10px;
      }

      form {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .field {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="password"],
      textarea,
      input[type="date"] {
        width: 100%;
        padding: 8px;
      }

      .radio-group {
        display: flex;
        gap: 20px;
      }

      .radio-group label {
        display: flex;
        align-items: center;
        gap: 5px;
        font-weight: normal;
      }

      .radio-group input {
        width: auto;
      }

      .actions {
        margin-top: 10px;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .submit {
        background: green;
        color: white;
      }

      .reset {
        background: orange;
        color: white;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
      }

      .icon-btn {
        cursor: pointer;
        border: none;
        background: none;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Form Data Mahasiswa</h2>

      <form id="formMahasiswa">
        <div class="field">
          <label>NIM</label>
          <input type="text" id="nim" required />
        </div>

        <div class="field">
          <label>Nama</label>
          <input type="text" id="nama" required />
        </div>

        <div class="field">
          <label>Alamat</label>
          <textarea id="alamat"></textarea>
        </div>

        <div class="field">
          <label>Jenis Kelamin</label>
          <div class="radio-group">
            <label><input type="radio" name="jk" value="Pria" /> Pria</label>
            <label
              ><input type="radio" name="jk" value="Wanita" /> Wanita</label
            >
            <label
              ><input type="radio" name="jk" value="Lainnya" /> Lainnya</label
            >
          </div>
        </div>

        <div class="field">
          <label>Tanggal Lahir</label>
          <input type="date" id="ttl" required />
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required />
        </div>

        <div class="actions">
          <button type="submit" class="submit">Submit</button>
          <button type="reset" class="reset">Reset</button>
        </div>
      </form>

      <h2>Data Mahasiswa</h2>

      <table>
        <thead>
          <tr>
            <th>NIM</th>
            <th>Nama</th>
            <th>Alamat</th>
            <th>JK</th>
            <th>TTL</th>
            <th>Password</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <script>
      const form = document.getElementById("formMahasiswa");
      const tableBody = document.getElementById("tableBody");

      const nimInput = document.getElementById("nim");
      const namaInput = document.getElementById("nama");
      const alamatInput = document.getElementById("alamat");
      const ttlInput = document.getElementById("ttl");
      const passwordInput = document.getElementById("password");

      let dataMahasiswa =
        JSON.parse(localStorage.getItem("dataMahasiswa")) || [];
      let editingIndex = null;

      // Format tanggal untuk tampilan
      function formatTanggal(dateStr) {
        const [year, month, day] = dateStr.split("-");
        return `${day}-${month}-${year}`;
      }

      // Render tabel
      function renderTable() {
        tableBody.innerHTML = "";

        dataMahasiswa.forEach((mhs, index) => {
          const row = document.createElement("tr");

          const masked = "•".repeat(mhs.password.length);

          row.innerHTML = `
            <td>${mhs.nim}</td>
            <td>${mhs.nama}</td>
            <td>${mhs.alamat}</td>
            <td>${mhs.jk}</td>
            <td>${formatTanggal(mhs.ttl)}</td>
            <td>${masked}</td>
            <td>
                <button class="icon-btn" onclick="editRow(${index})">✏️</button>
                <button class="icon-btn" onclick="deleteRow(${index})">🗑️</button>
            </td>
        `;

          tableBody.appendChild(row);
        });
      }

      // Submit handler
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const data = {
          nim: nimInput.value,
          nama: namaInput.value,
          alamat: alamatInput.value,
          jk: document.querySelector('input[name="jk"]:checked')?.value || "-",
          ttl: ttlInput.value,
          password: passwordInput.value,
        };

        if (editingIndex !== null) {
          dataMahasiswa[editingIndex] = data;
          editingIndex = null;
        } else {
          dataMahasiswa.push(data);
        }

        localStorage.setItem("dataMahasiswa", JSON.stringify(dataMahasiswa));

        renderTable();
        form.reset();
      });

      // Delete
      function deleteRow(index) {
        dataMahasiswa.splice(index, 1);
        localStorage.setItem("dataMahasiswa", JSON.stringify(dataMahasiswa));
        renderTable();
      }

      // Edit
      function editRow(index) {
        const mhs = dataMahasiswa[index];

        editingIndex = index;

        nimInput.value = mhs.nim;
        namaInput.value = mhs.nama;
        alamatInput.value = mhs.alamat;

        const radio = document.querySelector(
          `input[name="jk"][value="${mhs.jk}"]`,
        );
        if (radio) radio.checked = true;

        ttlInput.value = mhs.ttl;
        passwordInput.value = "";
      }

      // Init
      renderTable();
    </script>
  </body>
</html>
